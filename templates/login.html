<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		body {
			background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
			min-height: 100vh;
		}
		.card-login {
			border-radius: 1rem;
			box-shadow: 0 4px 24px rgba(0,0,0,0.08);
			padding: 2rem 2.5rem;
			background: #fff;
			max-width: 420px;
			margin: 4rem auto 2rem auto;
		}
		.brand {
			font-weight: 700;
			color: #2575fc;
			letter-spacing: 1px;
		}
		.btn-modern {
			background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%);
			color: #fff;
			border: none;
			border-radius: 2rem;
			padding: 0.5rem 2rem;
			font-weight: 600;
			transition: background 0.2s;
		}
		.btn-modern:hover {
			background: linear-gradient(90deg, #2575fc 0%, #6a11cb 100%);
		}
		.form-label {
			font-weight: 500;
		}
		.error, .success {
			border-radius: 0.5rem;
			margin-bottom: 1rem;
		}
		.error {
			background: #ffe6e6;
			border: 1px solid #ffb3b3;
			padding: 0.75rem;
		}
		.success {
			background: #e6ffe6;
			border: 1px solid #b3ffb3;
			padding: 0.75rem;
		}
		footer {
			text-align: center;
			color: #fff;
			margin-top: 2rem;
			font-size: 1rem;
			opacity: 0.8;
		}
	</style>
</head>
<body>
<div class="container d-flex flex-column justify-content-center align-items-center" style="min-height:100vh;">
	<div class="card-login w-100">
		<h2 class="mb-4 text-center brand">Task Manager Login</h2>
		<div class="mb-3 text-center">
			<a href="{{ url_for('home') }}" class="text-decoration-none">&larr; Back to home</a>
		</div>
		{% if request.args.get('success') %}
		<div class="success">{{ request.args.get('success') }}</div>
		{% endif %}
		{% if error %}
		<div class="error">{{ error }}</div>
		{% endif %}
		<form method="post" action="{{ url_for('login') }}">
			<div class="mb-3">
				<label for="identifier" class="form-label">Username or Email</label>
				<input id="identifier" name="identifier" type="text" class="form-control" required>
			</div>
			<div class="mb-3">
				<label for="password" class="form-label">Password</label>
				<input id="password" name="password" type="password" class="form-control" required>
			</div>
			<div class="d-grid mb-2">
				<button type="submit" class="btn btn-modern">Login</button>
			</div>
		</form>
		<div class="text-center mt-3">
			<span>Need an account?</span> <a href="{{ url_for('register') }}" class="text-decoration-none fw-bold" style="color:#2575fc;">Register</a>
		</div>
	</div>
</div>
<footer>
	&copy; kakkar09@2026
</footer>
</body>
</html>
