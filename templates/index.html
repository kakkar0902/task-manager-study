<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #43cea2 0%, #185a9d 100%);
            min-height: 100vh;
        }
        .card-home {
            border-radius: 1rem;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 2.5rem 2.5rem 2rem 2.5rem;
            background: #fff;
            max-width: 420px;
            margin: 4rem auto;
        }
        .brand {
            font-weight: 700;
            color: #185a9d;
            letter-spacing: 1px;
        }
        .btn-modern {
            background: linear-gradient(90deg, #43cea2 0%, #185a9d 100%);
            color: #fff;
            border: none;
            border-radius: 2rem;
            padding: 0.5rem 2rem;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn-modern:hover {
            background: linear-gradient(90deg, #185a9d 0%, #43cea2 100%);
        }
    </style>
</head>
<body>
<div class="container d-flex flex-column justify-content-center align-items-center" style="min-height:100vh;">
    <div class="card-home w-100">
        <h1 class="mb-3 text-center brand">Task Manager</h1>
        <p class="text-center mb-4">Organize your tasks efficiently and securely.</p>

        {% if g.user %}
        <div class="text-center mb-3">
            <span>Signed in as <strong>{{ g.user.username }}</strong>.</span>
        </div>
        <div class="d-grid gap-2 mb-3">
            <a href="{{ url_for('tasks') }}" class="btn btn-modern">Go to Tasks</a>
        </div>
        <form action="{{ url_for('logout') }}" method="post" class="d-grid">
            <button type="submit" class="btn btn-outline-danger">Logout</button>
        </form>
        {% else %}
        <div class="d-grid gap-2 mb-2">
            <a href="{{ url_for('login') }}" class="btn btn-modern">Login</a>
            <a href="{{ url_for('register') }}" class="btn btn-modern">Register</a>
        </div>
        {% endif %}
    </div>
</div>
</body>
</html>
